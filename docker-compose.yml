services:
  mysql:
    image: mysql:8.4
    container_name: testcase-ai-mysql
    environment:
      MYSQL_DATABASE: testcase_ai
      MYSQL_USER: testcase
      MYSQL_PASSWORD: testcase
      MYSQL_ROOT_PASSWORD: testcase-root
    ports:
      - "3306:3306"
    volumes:
      - testcase_ai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utestcase", "-ptestcase"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: testcase-ai-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - testcase_ai_etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: testcase-ai-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - testcase_ai_minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: testcase-ai-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - testcase_ai_milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  testcase_ai_mysql:
  testcase_ai_etcd:
  testcase_ai_minio:
  testcase_ai_milvus:
